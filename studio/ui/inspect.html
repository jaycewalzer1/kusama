<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>inspect</title>
    <style>
      :root {
        color-scheme: dark;
        --line: #2e2e2e;
        --dim: #7e7e7e;
        --dimmer: #5e5e5e;
        --warn: #d8b878;
        --bad: #e2725b;
        --good: #79a86b;
        --add: #79a86b;
        --del: #e2725b;
        --chg: #d8b878;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #161616;
        color: #ddd;
        display: grid;
        grid-template-columns: 232px 350px 1fr;
        height: 100vh;
        overflow: hidden;
      }
      aside,
      #spine,
      #panes {
        overflow-y: auto;
        padding: 12px;
      }
      aside {
        border-right: 1px solid var(--line);
        background: #131313;
      }
      #spine {
        border-right: 1px solid var(--line);
        padding: 0;
      }
      #panes {
        background: #0e0e0e;
        padding: 0 0 60px;
      }
      h1 {
        font-size: 11px;
        margin: 0 0 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
      }
      h2 {
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
        margin: 18px 0 6px;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      h2:first-of-type {
        margin-top: 4px;
      }
      select,
      button,
      input[type='text'] {
        width: 100%;
        font: inherit;
        padding: 4px 6px;
        background: #242424;
        color: #ddd;
        border: 1px solid #3a3a3a;
        border-radius: 3px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: #303030;
      }
      label.check {
        display: flex;
        gap: 6px;
        align-items: baseline;
        color: #bbb;
        cursor: pointer;
        padding: 1px 0;
        white-space: nowrap;
      }
      label.check:hover {
        color: #fff;
      }
      label.check input {
        margin: 0;
        accent-color: #7e7e7e;
      }
      label.check b {
        margin-left: auto;
        color: var(--dimmer);
        font-weight: 400;
      }
      .note {
        color: var(--dimmer);
        margin: 6px 0;
      }

      /* --- the spine ------------------------------------------------------ */
      .row {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 7px;
        padding: 4px 10px;
        border-bottom: 1px solid #1e1e1e;
        cursor: pointer;
        align-items: baseline;
      }
      .row:hover {
        background: #1c1c1c;
      }
      .row.on {
        background: #262626;
        box-shadow: inset 2px 0 0 #ddd;
      }
      .row .seq {
        color: var(--dimmer);
        text-align: right;
      }
      .row .k {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 10px;
      }
      .row .s {
        color: #b6b6b6;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .k-policy-call {
        color: #8fb8d8;
      }
      .k-step {
        color: #d8b878;
      }
      .k-render {
        color: #9d9d9d;
      }
      .k-phase {
        color: #c8a8d8;
      }
      .k-trigger {
        color: var(--bad);
      }
      .k-edit-refused {
        color: var(--bad);
      }
      .k-note {
        color: var(--dimmer);
      }
      .k-env-call {
        color: #7fb8a8;
      }
      .k-trajectory-start,
      .k-trajectory-end {
        color: #fff;
      }

      /* --- panes ---------------------------------------------------------- */
      .pane {
        border-bottom: 1px solid var(--line);
      }
      .pane > header {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 8px 14px;
        background: #141414;
        position: sticky;
        top: 0;
        z-index: 2;
        cursor: pointer;
        border-bottom: 1px solid #1e1e1e;
      }
      .pane > header b {
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #ccc;
        font-weight: 400;
      }
      .pane > header i {
        font-style: normal;
        color: var(--dimmer);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pane > header span {
        margin-left: auto;
        color: var(--dimmer);
      }
      .body {
        padding: 12px 14px 18px;
      }
      .pane.shut .body {
        display: none;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        color: #cfcfcf;
        background: #131313;
        border: 1px solid #202020;
        border-radius: 3px;
        padding: 9px 11px;
        max-height: 60vh;
        overflow: auto;
      }
      .sub {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .sub button {
        width: auto;
        padding: 2px 8px;
        font-size: 11px;
        color: var(--dim);
      }
      .sub button.on {
        color: #fff;
        background: #303030;
        border-color: #555;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      td,
      th {
        text-align: left;
        padding: 2px 10px 2px 0;
        vertical-align: top;
      }
      th {
        color: var(--dimmer);
        font-weight: 400;
        border-bottom: 1px solid var(--line);
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      /* --- the tree ------------------------------------------------------- */
      .tree {
        font-size: 11.5px;
      }
      .tree div {
        padding-left: 16px;
        border-left: 1px solid #232323;
      }
      .tree > div {
        border-left: 0;
        padding-left: 0;
      }
      .n {
        display: block;
        padding: 1px 4px;
        border-radius: 2px;
      }
      .n .ty {
        color: #c8a8d8;
      }
      .n .id {
        color: #ddd;
      }
      .n .op {
        color: #8fb8d8;
      }
      .n .rk {
        color: #4e4e4e;
      }
      .n .args {
        color: var(--dim);
      }
      .n.added {
        background: rgba(121, 168, 107, 0.16);
        box-shadow: inset 2px 0 0 var(--add);
      }
      .n.removed {
        background: rgba(226, 114, 91, 0.14);
        box-shadow: inset 2px 0 0 var(--del);
        opacity: 0.72;
      }
      .n.changed {
        background: rgba(216, 184, 120, 0.14);
        box-shadow: inset 2px 0 0 var(--chg);
      }

      /* --- corpus --------------------------------------------------------- */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
        gap: 10px;
      }
      .work {
        border: 1px solid var(--line);
        border-radius: 3px;
        overflow: hidden;
        background: #121212;
      }
      .work.seen {
        border-color: #6a6a6a;
      }
      .work img {
        width: 100%;
        height: 118px;
        object-fit: cover;
        display: block;
        background: #1c1c1c;
      }
      .work .meta {
        padding: 5px 6px;
        font-size: 10.5px;
        line-height: 1.4;
      }
      .work .t {
        color: #ccc;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .work .v {
        color: var(--dimmer);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bar {
        height: 2px;
        background: #2a2a2a;
      }
      .bar i {
        display: block;
        height: 2px;
        background: #8fb8d8;
      }
      .plate img {
        max-width: 100%;
        max-height: 56vh;
        border: 1px solid var(--line);
        background: #000;
      }
      a {
        color: #8fb8d8;
      }
      .miss {
        color: var(--dimmer);
        font-style: italic;
      }
      .live {
        color: var(--good);
      }
      .dead {
        color: var(--dimmer);
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>inspect</h1>
      <select id="run"></select>
      <div class="note" id="runline">no run</div>
      <div class="note" id="chain"></div>
      <button id="reload">reload</button>
      <p class="note"><a href="/">&larr; the studio</a></p>

      <h2>panes</h2>
      <div id="panes-toggles"></div>

      <h2>spine</h2>
      <input type="text" id="filter" placeholder="filter text" />
      <div id="kind-toggles" style="margin-top: 6px"></div>

      <h2>prompt parts</h2>
      <div id="part-toggles"></div>

      <h2>tree</h2>
      <div id="tree-toggles"></div>
    </aside>

    <div id="spine"></div>
    <div id="panes"></div>

    <script type="module" src="/studio/ui/inspect.js"></script>
  </body>
</html>
