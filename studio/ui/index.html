<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>studio</title>
    <style>
      :root {
        color-scheme: dark;
        --line: #2e2e2e;
        --dim: #7e7e7e;
        --warn: #d8b878;
        --bad: #e2725b;
        --good: #79a86b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #161616;
        color: #ddd;
        display: grid;
        grid-template-columns: 300px 1fr 440px;
        height: 100vh;
        overflow: hidden;
      }
      aside,
      #feed {
        overflow-y: auto;
        padding: 14px;
      }
      aside {
        border-right: 1px solid var(--line);
      }
      #feed {
        border-left: 1px solid var(--line);
        background: #131313;
      }
      main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-width: 0;
        /* Without this a tall plate sets main's min-content height and pushes the strip and the
           scores off the bottom of a body that cannot scroll. */
        min-height: 0;
        background: #0e0e0e;
      }
      h1 {
        font-size: 11px;
        margin: 0 0 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
      }
      h2 {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
        margin: 22px 0 8px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      label {
        display: block;
        color: var(--dim);
        margin: 10px 0 3px;
      }
      label i {
        color: #5e5e5e;
        font-style: normal;
      }
      input,
      button,
      select {
        width: 100%;
        font: inherit;
        padding: 5px 7px;
        background: #242424;
        color: #ddd;
        border: 1px solid #3a3a3a;
        border-radius: 3px;
      }
      button {
        cursor: pointer;
        margin-top: 10px;
      }
      button:hover:not([disabled]) {
        background: #303030;
      }
      button[disabled] {
        opacity: 0.45;
        cursor: default;
      }
      .picks {
        border: 1px solid var(--line);
        border-radius: 3px;
        max-height: 168px;
        overflow-y: auto;
      }
      .picks div {
        display: flex;
        gap: 7px;
        align-items: baseline;
        padding: 3px 7px;
        cursor: pointer;
        white-space: nowrap;
      }
      .picks div > * {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .picks div:hover {
        background: #202020;
      }
      .picks input {
        width: auto;
        margin: 0;
      }
      .picks span {
        color: var(--dim);
      }
      .picks .read,
      button.add {
        width: auto;
        margin: 0 0 0 auto;
        padding: 0 5px;
        flex: none;
        color: var(--dim);
        background: none;
        border: 1px solid #3a3a3a;
        font-size: 11px;
        line-height: 1.5;
      }
      .picks .read:hover,
      button.add:hover {
        color: #ddd;
      }
      /* A document is prose. It is read in the middle column, where the picture would be. */
      .doc {
        max-width: 78ch;
        justify-self: start;
        align-self: start;
        padding-bottom: 30px;
      }
      .doc h2 {
        margin-top: 26px;
      }
      .doc h3 {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--dim);
        margin: 16px 0 2px;
      }
      .doc p,
      .doc li {
        margin: 0 0 6px;
        color: #c8c8c8;
      }
      .doc ul {
        margin: 0;
        padding-left: 16px;
      }
      .doc .doc-note {
        color: var(--dim);
        border-left: 2px solid var(--line);
        padding-left: 10px;
      }
      .doc textarea {
        width: 100%;
        font: inherit;
        padding: 6px 8px;
        background: #1b1b1b;
        color: #ddd;
        border: 1px solid #3a3a3a;
        border-radius: 3px;
        resize: vertical;
      }
      .doc .note {
        white-space: pre-wrap;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        align-items: end;
      }
      .note {
        color: var(--dim);
        margin-top: 8px;
      }
      #atlases {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: -4px 0 4px;
      }
      #atlases a {
        padding: 3px 7px;
        border: 1px solid #3a3a3a;
        border-radius: 3px;
        background: #242424;
        color: #ddd;
        text-decoration: none;
      }
      #atlases a:hover {
        background: #303030;
      }
      #atlases .missing {
        color: var(--dim);
      }
      .note.bad {
        color: var(--bad);
      }
      #runs div.run {
        padding: 6px 8px;
        border: 1px solid transparent;
        border-radius: 3px;
        cursor: pointer;
      }
      #runs div.run:hover {
        background: #1f1f1f;
      }
      #runs div.run.on {
        border-color: #4a4a4a;
        background: #202020;
      }
      #runs .who {
        overflow-wrap: anywhere;
      }
      #runs .meta {
        color: var(--dim);
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 5px;
        background: #555;
      }
      .dot.running {
        background: var(--warn);
        animation: pulse 1.2s infinite;
      }
      .dot.finished {
        background: var(--good);
      }
      .dot.stopped {
        background: var(--bad);
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 14px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      header b {
        font-weight: 600;
      }
      header .meta {
        color: var(--dim);
      }
      header button {
        width: auto;
        margin: 0;
        padding: 3px 10px;
      }
      #stage {
        display: grid;
        /* safe: an image bigger than the stage must overflow downwards, where it can be
           scrolled to, not upwards past the top edge. */
        place-items: safe center;
        overflow: auto;
        /* Reading a document starts at its top, not where the last one was scrolled to. */
        overflow-anchor: none;
        padding: 16px;
        min-height: 0;
      }
      #stage img {
        max-width: 100%;
        max-height: 100%;
        background: #fff;
        box-shadow: 0 6px 28px #0009;
        cursor: zoom-in;
      }
      /* A sketch sheet is twice as tall as it is wide; fitted to the stage it is unreadable. */
      #stage img.full {
        max-width: none;
        max-height: none;
        cursor: zoom-out;
      }
      #stage .empty {
        color: var(--dim);
        text-align: center;
        max-width: 46ch;
      }
      footer {
        border-top: 1px solid var(--line);
        padding: 10px 16px;
        display: grid;
        gap: 10px;
      }
      #strip {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        align-items: center;
        min-height: 54px;
      }
      footer img {
        height: 52px;
        background: #fff;
        border: 1px solid transparent;
        cursor: pointer;
        flex: none;
      }
      footer img.on {
        border-color: var(--warn);
      }
      footer .tag {
        color: var(--dim);
        flex: none;
        padding-right: 4px;
      }
      #scores {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        color: var(--dim);
      }
      #scores b {
        color: #ddd;
        font-weight: 600;
      }
      .stderr {
        color: var(--bad);
        white-space: pre-wrap;
        border-top: 1px solid var(--line);
        margin-top: 10px;
        padding-top: 8px;
      }

      /* The story: acts shut, beats one line each, and the detail only where it is asked for. */
      #modes {
        display: flex;
        gap: 5px;
        align-items: baseline;
        margin-bottom: 12px;
      }
      #modes button {
        width: auto;
        margin: 0;
        padding: 2px 10px;
        color: var(--dim);
        font-size: 11px;
      }
      #modes button.on {
        color: #ddd;
        border-color: #666;
      }
      #modes .fold {
        color: var(--dim);
        margin-left: auto;
      }
      .act {
        margin-bottom: 4px;
      }
      /* Two lines, not one row: the title and the roll-up both want the full column width, and a
         flex row makes them fight over it and lose at any panel width a person actually uses. */
      .act > .cap {
        display: grid;
        grid-template-columns: 12px 1fr;
        gap: 0 8px;
        cursor: pointer;
        padding: 6px 8px;
        background: #1b1b1b;
        border-left: 2px solid #444;
      }
      .act > .cap:hover {
        background: #232323;
      }
      .act.bad > .cap {
        border-left-color: var(--bad);
      }
      .act.warn > .cap {
        border-left-color: var(--warn);
      }
      .act.good > .cap {
        border-left-color: var(--good);
      }
      .act .cap .arrow {
        color: var(--dim);
      }
      .act .cap b {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .act .roll {
        grid-column: 2;
        color: var(--dim);
        overflow-wrap: anywhere;
      }
      .act .beats {
        padding: 3px 0 8px 11px;
      }
      .beat {
        border-left: 2px solid #303030;
        padding: 2px 0 2px 9px;
      }
      .beat.good {
        border-left-color: var(--good);
      }
      .beat.warn {
        border-left-color: var(--warn);
      }
      .beat.bad {
        border-left-color: var(--bad);
      }
      .beat > .line {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0 8px;
        cursor: pointer;
        padding: 2px 0;
      }
      .beat > .line:hover {
        background: #1c1c1c;
      }
      .beat .tag {
        color: var(--dim);
      }
      .beat .what {
        overflow-wrap: anywhere;
      }
      .beat .cost {
        grid-column: 2;
        color: #5e5e5e;
      }
      .beat .body {
        padding: 2px 0 8px;
      }
      .beat .said {
        color: #b9b9b9;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 2px 0 6px;
      }
      .beat .note {
        margin: 0 0 3px;
        color: #9e9e9e;
        overflow-wrap: anywhere;
        display: flex;
        gap: 7px;
      }
      .beat .note.warn {
        color: var(--warn);
      }
      .beat .note.bad {
        color: var(--bad);
      }
      .beat .note .n {
        flex: none;
        color: var(--dim);
        min-width: 26px;
        text-align: right;
      }
      .beat .raw {
        width: auto;
        margin: 4px 0 0;
        padding: 1px 8px;
        font-size: 11px;
        color: var(--dim);
      }
      .beat pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #0d0d0d;
        border: 1px solid var(--line);
        padding: 8px;
        margin: 6px 0 0;
        max-height: 340px;
        overflow: auto;
        color: #a8a8a8;
      }
      /* The score under a plate in the strip: the run's own eval bar, so a glance says where it
         got better and where it stalled. */
      footer .plate {
        flex: none;
        display: grid;
        gap: 2px;
        cursor: pointer;
      }
      footer .plate .bar {
        height: 3px;
        background: #333;
      }
      footer .plate .bar span {
        display: block;
        height: 100%;
        background: var(--good);
      }
      footer .plate.hard .bar span {
        background: var(--bad);
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>studio</h1>
      <div id="atlases"></div>

      <label>position <i>— the taste it works from</i> <button class="add" id="new-position">+ new</button></label>
      <div class="picks" id="positions"></div>
      <label>condition <i>— the situation it works in</i> <button class="add" id="new-brief">+ new</button></label>
      <div class="picks" id="briefs"></div>

      <div class="two">
        <div>
          <label for="seed">seed <i>— same seed, same run</i></label>
          <input id="seed" value="1" />
        </div>
        <div>
          <label for="steps">steps <i>— edits it is told it has</i></label>
          <input id="steps" value="12" />
        </div>
      </div>
      <div class="two">
        <div>
          <label for="sketches">sketches <i>— tries per problem</i></label>
          <input id="sketches" value="3" />
        </div>
        <div>
          <label for="control">control arm <i>— no position</i></label>
          <select id="control">
            <option value="">no</option>
            <option value="1">yes</option>
          </select>
        </div>
      </div>

      <button id="start">Start</button>
      <div class="note" id="plan"></div>

      <h2>runs</h2>
      <div id="runs"></div>
    </aside>

    <main>
      <header>
        <b id="title">no run selected</b>
        <span class="meta" id="subtitle"></span>
        <span style="flex: 1"></span>
        <button id="doc-title" hidden>Close</button>
        <button id="stop" hidden>Stop</button>
      </header>
      <div id="stage"><div class="empty">Pick a position and a condition on the left and press Start, or choose a finished run to read it.</div></div>
      <footer>
        <div id="strip"></div>
        <div id="scores"></div>
      </footer>
    </main>

    <section id="feed">
      <div id="modes">
        <button id="expand">expand all</button>
        <button id="export" hidden>export</button>
        <span class="fold" id="fold"></span>
      </div>
      <div id="story"></div>
      <div class="stderr" id="stderr" hidden></div>
    </section>

    <script type="module" src="/studio/ui/studio.js"></script>
  </body>
</html>
