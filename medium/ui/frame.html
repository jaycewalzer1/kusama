<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>medium preview frame</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }
      canvas {
        display: block;
      }
      #err {
        font: 13px/1.5 ui-monospace, monospace;
        color: #b00020;
        padding: 16px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <!--
      The same three tags as renderer/page.html, in the same order, so the preview draws through the
      same code path the real renderer uses. This frame is reloaded for every render on purpose:
      p5.brush keeps a blend-source framebuffer between draws (NOTES R1).
    -->
    <script src="/vendor/p5.min.js"></script>
    <script src="/vendor/p5.brush.js"></script>
    <script type="module" src="/renderer/page.js"></script>
    <script type="module">
      const file = new URL(location.href).searchParams.get('file');
      const tell = (msg) => parent.postMessage(msg, '*');

      const fail = (message) => {
        document.body.innerHTML = `<div id="err">${message}</div>`;
        tell({ kind: 'error', message });
      };

      try {
        const res = await fetch(`/api/resolve?file=${encodeURIComponent(file)}`);
        const data = await res.json();
        if (data.error) {
          const detail = (data.issues ?? []).map((i) => `${i.path}: ${i.message} [${i.code}]`).join('\n');
          throw new Error(detail ? `${data.error}\n\n${detail}` : data.error);
        }

        // page.js sets this up; wait for it rather than assuming module order.
        while (!window.__mediumReady) await new Promise((r) => setTimeout(r, 10));

        const started = performance.now();
        const out = await window.__mediumRender(data);
        tell({
          kind: 'done',
          width: out.width,
          height: out.height,
          elapsedMs: Math.round(performance.now() - started),
          timings: out.timings,
          gl: out.gl,
          budget: data.budget,
          programHash: data.programHash,
          nodes: data.resolved.nodes.length,
        });
      } catch (e) {
        fail(e && e.stack ? e.stack : String(e));
      }
    </script>
  </body>
</html>
